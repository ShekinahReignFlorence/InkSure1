    <script>
      (function() {
        // Suppress browser extension injection errors
        window.addEventListener('error', function(e) {
          if ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        // Ensure window.fetch has a setter so extension interceptors can safely assign without throwing
        try {
          var _f = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _f;
            },
            set: function(newFetch) {
              _f = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
